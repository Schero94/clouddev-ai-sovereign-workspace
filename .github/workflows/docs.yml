name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - docs/**
      - docs-site/**
      - mkdocs.yml
      - package.json
      - scripts/check-docs-artifact.mjs
      - scripts/generate-docs-status.mjs
      - tests/unit/docs-site.test.mjs
      - GATES.md
      - README.md
      - SECURITY.md
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - docs/**
      - docs-site/**
      - mkdocs.yml
      - package.json
      - scripts/check-docs-artifact.mjs
      - scripts/generate-docs-status.mjs
      - tests/unit/docs-site.test.mjs
      - GATES.md
      - README.md
      - SECURITY.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up the pinned documentation toolchain
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.13"
      - name: Sync locked documentation dependencies
        run: uv sync --project docs-site --locked
      - name: Build and inspect documentation artifact
        run: npm run docs:check
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: .docs-site/site
          name: github-pages

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish reviewed documentation artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
