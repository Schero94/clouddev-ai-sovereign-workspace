name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "26.13.1"
      - name: Set up the pinned documentation toolchain
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.13"
      - name: Install the Railway IaC toolchain
        run: npm --prefix .railway ci
      - name: Generate the release-status page
        run: npm run docs:generate
      - name: Run unit and contract tests
        run: npm test
      - name: Run Forgejo entrypoint tests
        run: npm run test:forgejo
      - name: Run static security checks
        run: npm run test:security
      - name: Type-check Railway IaC
        run: npm run check:railway
      - name: Check the Railway template contract
        run: npm run check:railway-template
      - name: Check Docker build contexts
        run: npm run check:docker-context
      - name: Check launchpad syntax
        run: npm run check:launchpad
      - name: Build and inspect documentation
        run: npm run docs:check
