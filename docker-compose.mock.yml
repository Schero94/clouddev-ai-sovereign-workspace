services:
  clouddev-mock-llm:
    profiles: [integration]
    image: clouddev-mock-llm:test
    build:
      context: .
      dockerfile: tests/mock-llm/Dockerfile
    command: ["node", "/opt/clouddev-mock-llm/server.mjs"]
    user: "1000:1000"
    environment:
      PORT: "18080"
      CLOUDDEV_MOCK_LLM_API_KEY: clouddev-test-mock-key
    expose:
      - "18080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 2s
    restart: "no"
